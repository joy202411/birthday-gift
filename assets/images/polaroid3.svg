<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <radialGradient id="bokehBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#3d1847"/>
      <stop offset="60%" stop-color="#230d30"/>
      <stop offset="100%" stop-color="#12061a"/>
    </radialGradient>
    <linearGradient id="champagneGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="50%" stop-color="#f5c77e"/>
      <stop offset="100%" stop-color="#cf8e42"/>
    </linearGradient>
    <filter id="bokehBlur">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="600" height="700" fill="url(#bokehBg)"/>

  <!-- Bokeh spheres -->
  <circle cx="150" cy="220" r="45" fill="#f8ad9d" opacity="0.25" filter="url(#bokehBlur)"/>
  <circle cx="450" cy="280" r="70" fill="#ffd166" opacity="0.2" filter="url(#bokehBlur)"/>
  <circle cx="280" cy="140" r="55" fill="#e8b4b8" opacity="0.3" filter="url(#bokehBlur)"/>
  <circle cx="180" cy="450" r="60" fill="#f4978e" opacity="0.22" filter="url(#bokehBlur)"/>
  <circle cx="420" cy="480" r="50" fill="#ffd1dc" opacity="0.25" filter="url(#bokehBlur)"/>

  <!-- Toasting Flutes (Rose Gold & Glass) -->
  <g transform="translate(260, 260) rotate(-16)">
    <!-- Glass bowl left -->
    <path d="M -30 -90 Q -32 -20 0 10 Q 32 -20 30 -90 Z" fill="rgba(255, 230, 235, 0.25)" stroke="#f7cad0" stroke-width="2"/>
    <!-- Liquid -->
    <path d="M -26 -65 Q -28 -15 0 8 Q 28 -15 26 -65 Z" fill="url(#champagneGold)" opacity="0.8"/>
    <!-- Stem & Base -->
    <line x1="0" y1="10" x2="0" y2="100" stroke="#f7cad0" stroke-width="3"/>
    <ellipse cx="0" cy="100" rx="25" ry="5" fill="#f7cad0"/>
  </g>

  <g transform="translate(340, 260) rotate(16)">
    <!-- Glass bowl right -->
    <path d="M -30 -90 Q -32 -20 0 10 Q 32 -20 30 -90 Z" fill="rgba(255, 230, 235, 0.25)" stroke="#f7cad0" stroke-width="2"/>
    <!-- Liquid -->
    <path d="M -26 -65 Q -28 -15 0 8 Q 28 -15 26 -65 Z" fill="url(#champagneGold)" opacity="0.8"/>
    <!-- Stem & Base -->
    <line x1="0" y1="10" x2="0" y2="100" stroke="#f7cad0" stroke-width="3"/>
    <ellipse cx="0" cy="100" rx="25" ry="5" fill="#f7cad0"/>
  </g>

  <!-- Clinking Star Sparkle -->
  <g transform="translate(300, 200) scale(1.2)" fill="#fff" filter="url(#bokehBlur)">
    <circle cx="0" cy="0" r="15" fill="#ffe5ec"/>
  </g>
  <g transform="translate(300, 200)" fill="#fff">
    <path d="M 0 -30 Q 0 0 30 0 Q 0 0 0 30 Q 0 0 -30 0 Q 0 0 0 -30 Z"/>
    <circle cx="0" cy="0" r="4" fill="#ffd166"/>
  </g>

  <!-- Sparkle floating bubbles -->
  <circle cx="280" cy="170" r="3" fill="#ffeaa7"/>
  <circle cx="320" cy="160" r="2.5" fill="#ffeaa7"/>
  <circle cx="310" cy="130" r="4" fill="#ffeaa7"/>
  <circle cx="295" cy="110" r="2" fill="#ffeaa7"/>
  <circle cx="240" cy="220" r="3" fill="#ffeaa7"/>
  <circle cx="360" cy="230" r="3" fill="#ffeaa7"/>

  <text x="300" y="650" font-family="'Great Vibes', cursive, serif" font-size="34" fill="#ffd1dc" text-anchor="middle">A Toast to Sreoshi</text>
</svg>