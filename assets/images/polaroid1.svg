<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#150a24"/>
      <stop offset="50%" stop-color="#2a1240"/>
      <stop offset="100%" stop-color="#4a1c58"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ffdfd3" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#e8b4b8" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#e8b4b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roseGoldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe5ec"/>
      <stop offset="50%" stop-color="#f8ad9d"/>
      <stop offset="100%" stop-color="#c8798a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Sky -->
  <rect width="600" height="700" fill="url(#skyGrad1)"/>

  <!-- Moon Glow & Crescent -->
  <circle cx="420" cy="210" r="160" fill="url(#moonGlow)"/>
  <path d="M 430 140 A 70 70 0 1 0 490 260 A 60 60 0 1 1 430 140 Z" fill="url(#roseGoldAcc)" filter="url(#glow)"/>

  <!-- Clouds Silhouettes -->
  <path d="M 50 560 Q 120 500 220 520 Q 320 480 420 530 Q 520 490 600 550 L 600 700 L 0 700 L 0 570 Z" fill="#200d31" opacity="0.8"/>
  <path d="M 0 610 Q 150 560 300 600 Q 450 550 600 610 L 600 700 L 0 700 Z" fill="#140720"/>

  <!-- Twinkling Stars -->
  <g fill="#fff" filter="url(#glow)">
    <circle cx="120" cy="120" r="2.5" opacity="0.9"/>
    <circle cx="180" cy="240" r="2" opacity="0.8"/>
    <circle cx="280" cy="110" r="3" opacity="0.95"/>
    <circle cx="340" cy="180" r="1.5" opacity="0.7"/>
    <circle cx="90" cy="320" r="2" opacity="0.85"/>
    <circle cx="220" cy="380" r="2.5" opacity="0.9"/>
    <circle cx="510" cy="110" r="2" opacity="0.8"/>
    <circle cx="530" cy="360" r="1.5" opacity="0.75"/>
    <circle cx="390" cy="340" r="3" opacity="0.9"/>
  </g>

  <!-- Big Sparkle Star -->
  <g transform="translate(160, 160)" fill="url(#roseGoldAcc)" filter="url(#glow)">
    <path d="M 0 -22 Q 0 0 22 0 Q 0 0 0 22 Q 0 0 -22 0 Q 0 0 0 -22 Z"/>
  </g>
  <g transform="translate(480, 290) scale(0.6)" fill="url(#roseGoldAcc)" filter="url(#glow)">
    <path d="M 0 -22 Q 0 0 22 0 Q 0 0 0 22 Q 0 0 -22 0 Q 0 0 0 -22 Z"/>
  </g>

  <!-- Constellation lines -->
  <path d="M 120 120 L 160 160 L 280 110 L 340 180" stroke="rgba(232, 180, 184, 0.4)" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>

  <!-- Text / Aesthetic Quote -->
  <text x="300" y="650" font-family="'Great Vibes', cursive, serif" font-size="34" fill="#ffd1dc" text-anchor="middle" letter-spacing="1">Starlit Radiance</text>
</svg>